<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Portfolio | V-Track Pro</title>
  <script src="js/vtrack-theme.js"></script>
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="stylesheet" href="css/vtrack-shell.css">
</head>
<body>
  <div id="vtrack-header"></div>
  <main class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h4 class="fw-bold mb-1">My Portfolio</h4>
        <p class="text-muted mb-0">Your vehicles, what they earn and what is left to pay. You see only your own records.</p>
      </div>
      <div class="d-flex gap-2" id="page-actions"></div>
    </div>
    <div class="row g-3 mb-4" id="stats"></div>
    <div class="card mb-4"><div class="card-header fw-semibold">My vehicles and payback</div><div class="card-body p-0" id="vehicles"></div></div>
    <div class="card mb-4"><div class="card-header fw-semibold">My contracts</div><div class="card-body p-0" id="contracts"></div></div>
    <div class="card mb-4"><div class="card-header fw-semibold" id="stmt-title">This month's earnings</div><div class="card-body p-0" id="statement"></div></div>
    <div class="card"><div class="card-header fw-semibold">Payments</div><div class="card-body p-0" id="payments"></div></div>
  </main>
  <script src="js/vendor/bootstrap.bundle.min.js"></script>
  <script src="js/vtrack-api.js"></script>
  <script src="js/vtrack-nav.js"></script>
  <script src="js/vtrack-biz.js"></script>
  <script>

    // references for contract receipts are stored as contract:<id>:<ref>; people only need to see their own part
    const shortRef = (r) => { const t = String(r || '').split(':'); return t.length > 1 ? t[t.length - 1] : r; };
    Biz.start(async () => {
      const r = await Biz.run(() => VTrackAPI.get('/portal/investor')); if (!r) return;
      const d = r.data;
      const st = d.statements.flatMap((s) => s.vehicles);
      const earned = d.statements.reduce((a, s) => a + s.totals.netToOwner, 0);
      const owed = d.contracts.reduce((a, c) => a + c.outstandingPesewas, 0);
      const balance = d.statements.reduce((a, s) => a + s.ledgerBalance, 0);
      document.getElementById('stats').innerHTML = Biz.stat('Vehicles', d.vehicles.length) + Biz.stat('Earned this month', Biz.ghs(earned)) + Biz.stat('Balance owed to me', Biz.ghs(balance)) + Biz.stat('Still to pay on contracts', Biz.ghs(owed));
      const pb = (id) => (st.find((x) => x.vehicleId === id) || {}).payback;
      const bar = (p) => p == null ? '—' : `<div class="progress" style="height:8px;min-width:120px"><div class="progress-bar" style="width:${p}%"></div></div><div class="fs-13 text-muted">${p}%</div>`;
      document.getElementById('vehicles').innerHTML = Biz.table([
        { label: 'Vehicle', render: (v) => `<span class="fw-medium">${Biz.esc(v.plateNumber)}</span><div class="text-muted fs-13">${Biz.esc([v.brand, v.model].filter(Boolean).join(' '))}</div>` },
        { label: 'Status', render: (v) => Biz.badge(v.lifecycleStatus) },
        { label: 'Earned to date', cls: 'text-end', render: (v) => Biz.ghs((pb(v.id) || {}).earnedToDatePesewas) },
        { label: 'Average per week', cls: 'text-end', render: (v) => Biz.ghs((pb(v.id) || {}).averageWeeklyNetPesewas) },
        { label: 'Payback progress', render: (v) => bar((pb(v.id) || {}).progressPct) },
        { label: 'Weeks left', cls: 'text-end', render: (v) => { const p = pb(v.id) || {}; return p.weeksRemaining == null ? '<span class="text-muted">Not enough data</span>' : p.weeksRemaining; } },
      ], d.vehicles, 'No vehicles yet.');
      document.getElementById('contracts').innerHTML = Biz.table([
        { label: 'Contract', render: (c) => Biz.esc(c.contractNo) }, { label: 'Type', render: (c) => Biz.label(c.mode) }, { label: 'Status', render: (c) => Biz.badge(c.status) },
        { label: 'Price', cls: 'text-end', render: (c) => Biz.ghs(c.pricePesewas) }, { label: 'Paid', cls: 'text-end', render: (c) => Biz.ghs(c.paidPesewas) },
        { label: 'Outstanding', cls: 'text-end', render: (c) => Biz.ghs(c.outstandingPesewas) }, { label: 'Next due', render: (c) => Biz.esc(c.nextDue || '—') },
      ], d.contracts, 'No contracts.');
      document.getElementById('stmt-title').textContent = `Earnings ${d.statementPeriod.from} to ${d.statementPeriod.to}`;
      document.getElementById('statement').innerHTML = Biz.table([
        { label: 'Vehicle', render: (v) => Biz.esc(v.plateNumber) }, { label: 'Days settled', cls: 'text-end', render: (v) => v.settledDays },
        { label: 'Collected', cls: 'text-end', render: (v) => Biz.ghs(v.grossCollected) }, { label: 'My share', cls: 'text-end', render: (v) => Biz.ghs(v.netToOwner) },
      ], st, 'No settled days in this period.');
      document.getElementById('payments').innerHTML = Biz.table([
        { label: 'When', render: (p) => new Date(p.createdAt).toLocaleString('en-GB') }, { label: 'Purpose', render: (p) => Biz.badge(p.purpose) }, { label: 'Method', render: (p) => Biz.label(p.method) },
        { label: 'Reference', render: (p) => `<code>${Biz.esc(shortRef(p.reference))}</code>` }, { label: 'Amount', cls: 'text-end', render: (p) => Biz.ghs(p.amountPesewas) },
      ], d.payments, 'No payments yet.');
    });
  </script>
</body>
</html>
