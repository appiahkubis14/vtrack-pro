<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password | V-Track Pro</title>
  <script src="js/vtrack-theme.js"></script>
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="stylesheet" href="css/vtrack-shell.css">
</head>
<body>
  <div id="vtrack-header"></div>
  <main class="container py-5" style="max-width:520px">
    <h4 class="fw-bold mb-1">Change your password</h4>
    <p class="text-muted" id="why">Choose a password only you know.</p>
    <div class="alert alert-danger d-none" id="err"></div>
    <form id="f" class="card card-body">
      <div class="mb-3"><label class="form-label">Current (or temporary) password</label><input type="password" class="form-control" id="cur" required autocomplete="current-password"></div>
      <div class="mb-3"><label class="form-label">New password</label><input type="password" class="form-control" id="new" required autocomplete="new-password"><div class="form-text">At least 10 characters with an upper-case letter, a lower-case letter, a digit and a symbol.</div></div>
      <div class="mb-3"><label class="form-label">Repeat new password</label><input type="password" class="form-control" id="rep" required autocomplete="new-password"></div>
      <button class="btn btn-primary" id="go">Change password</button>
    </form>
  </main>
  <script src="js/vendor/bootstrap.bundle.min.js"></script>
  <script src="js/vtrack-api.js"></script>
  <script src="js/vtrack-nav.js"></script>
  <script src="js/vtrack-biz.js"></script>
  <script>
    Biz.start(() => {
      const u = VTrackAPI.getUser();
      if (u && u.mustChangePassword) document.getElementById('why').textContent = 'Your account was created by an administrator. Choose your own password before continuing.';
      document.getElementById('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = document.getElementById('err'); err.classList.add('d-none');
        const n = document.getElementById('new').value;
        if (n !== document.getElementById('rep').value) { err.textContent = 'The two new passwords do not match.'; err.classList.remove('d-none'); return; }
        try {
          await VTrackAPI.post('/account/change-password', { currentPassword: document.getElementById('cur').value, newPassword: n });
          VTrackAPI.updateUser({ mustChangePassword: false });
          Biz.toast('Password changed');
          setTimeout(() => { window.location.href = VTrackAPI.homeFor(VTrackAPI.getUser()); }, 800);
        } catch (ex) { err.textContent = ex.message; err.classList.remove('d-none'); }
      });
    });
  </script>
</body>
</html>
