<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quotes | V-Track Pro</title>
  <script src="js/vtrack-theme.js"></script>
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="stylesheet" href="css/vtrack-shell.css">
</head>
<body>
  <div id="vtrack-header"></div>

  <main class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-1">Quotes</h4>
        <p class="text-muted mb-0" id="quotes-subtitle">Loading...</p>
      </div>
      <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createQuoteModal"><i class="bi bi-plus-lg me-1"></i>New Quote</button>
    </div>

    <div class="card">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th class="ps-4">Quote #</th>
                <th>Lead</th>
                <th>Total</th>
                <th>Status</th>
                <th>Expires</th>
                <th class="pe-4 text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="quotes-table-body">
              <tr><td colspan="6" class="text-center text-muted py-5">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Create Quote Modal -->
  <div class="modal fade" id="createQuoteModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="create-quote-form">
          <div class="modal-header">
            <h5 class="modal-title">New Quote</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="create-quote-error" class="alert alert-danger d-none"></div>
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label">Lead (optional)</label>
                <select class="form-select" id="q-lead-id">
                  <option value="">— No lead —</option>
                </select>
              </div>
              <div class="col-3">
                <label class="form-label">Currency</label>
                <select class="form-select" id="q-currency">
                  <option value="GHS">GHS</option>
                  <option value="USD">USD</option>
                  <option value="NGN">NGN</option>
                </select>
              </div>
              <div class="col-3">
                <label class="form-label">Country</label>
                <input type="text" class="form-control" id="q-country" placeholder="GH" maxlength="2">
              </div>
            </div>

            <label class="form-label">Line Items</label>
            <div id="quote-lines"></div>
            <button type="button" class="btn btn-sm btn-outline-secondary mt-2" id="add-line-btn"><i class="bi bi-plus-lg me-1"></i>Add Product</button>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="create-quote-submit">Generate Quote</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/vendor/bootstrap.bundle.min.js"></script>
  <script src="js/vtrack-api.js"></script>
  <script src="js/vtrack-nav.js"></script>
  <script src="js/vtrack-tables.js"></script>
  <script>
    window.VTrackAPI.requireAuth();
    window.VTrackNav.render();

    const statusColor = {
      draft: 'secondary', pending_approval: 'warning', sent: 'primary', accepted: 'success',
      rejected: 'danger', expired: 'secondary', converted_to_order: 'success',
    };

    let products = [];

    async function loadReferenceData() {
      const [productsRes, leadsRes] = await Promise.all([
        window.VTrackAPI.get('/products'),
        window.VTrackAPI.get('/leads?limit=100'),
      ]);
      products = productsRes.data;

      const leadSelect = document.getElementById('q-lead-id');
      leadsRes.data.forEach((l) => {
        const opt = document.createElement('option');
        opt.value = l.id;
        opt.textContent = `${l.contactName}${l.companyName ? ' - ' + l.companyName : ''}`;
        leadSelect.appendChild(opt);
      });
    }

    function addLineRow() {
      const container = document.getElementById('quote-lines');
      const row = document.createElement('div');
      row.className = 'row g-2 align-items-center mb-2 quote-line-row';
      row.innerHTML = `
        <div class="col-5">
          <select class="form-select form-select-sm line-product">
            ${products.map((p) => `<option value="${p.id}">${p.name}</option>`).join('')}
          </select>
        </div>
        <div class="col-2">
          <input type="number" class="form-control form-control-sm line-qty" value="1" min="1">
        </div>
        <div class="col-3">
          <select class="form-select form-select-sm line-cycle">
            <option value="monthly">Monthly</option>
            <option value="annual">Annual</option>
          </select>
        </div>
        <div class="col-1 d-flex align-items-center">
          <input type="checkbox" class="form-check-input line-install" title="Include installation">
        </div>
        <div class="col-1 text-end">
          <button type="button" class="btn btn-sm btn-outline-danger remove-line-btn"><i class="bi bi-x"></i></button>
        </div>`;
      container.appendChild(row);
      row.querySelector('.remove-line-btn').addEventListener('click', () => row.remove());
    }

    async function loadQuotes() {
      const res = await window.VTrackAPI.get('/quotes?limit=100');
      const quotes = res.data;
      document.getElementById('quotes-subtitle').textContent = `${quotes.length} quote${quotes.length === 1 ? '' : 's'} total`;

      const tbody = document.getElementById('quotes-table-body');
      if (!quotes.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5">No quotes yet.</td></tr>';
        return;
      }

      tbody.innerHTML = quotes
        .map((q) => {
          const color = statusColor[q.status] || 'secondary';
          const actions = [];
          if (q.status === 'draft' || q.status === 'pending_approval') {
            actions.push(`<button class="btn btn-sm btn-outline-primary send-btn" data-id="${q.id}">Send</button>`);
          }
          if (q.status === 'sent') {
            actions.push(`<button class="btn btn-sm btn-outline-success accept-btn" data-id="${q.id}">Accept</button>`);
            actions.push(`<button class="btn btn-sm btn-outline-danger reject-btn" data-id="${q.id}">Reject</button>`);
          }
          actions.push(`<a class="btn btn-sm btn-outline-secondary" href="${window.VTrackAPI.baseUrl}/quotes/${q.id}/pdf" target="_blank"><i class="bi bi-file-pdf"></i></a>`);

          return `
        <tr>
          <td class="ps-4 fw-medium">${q.quoteNumber}</td>
          <td class="fs-13 text-muted">${q.leadId ? q.leadId.slice(0, 8) : '—'}</td>
          <td>${Number(q.grandTotal).toLocaleString()} ${q.currency}</td>
          <td><span class="badge bg-${color}-subtle text-${color} text-capitalize">${q.status.replace(/_/g, ' ')}</span></td>
          <td class="fs-13 text-muted">${q.expiresAt ? new Date(q.expiresAt).toLocaleDateString() : '—'}</td>
          <td class="pe-4 text-end">${actions.join(' ')}</td>
        </tr>`;
        })
        .join('');

      tbody.querySelectorAll('.send-btn').forEach((btn) =>
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try {
            await window.VTrackAPI.post(`/quotes/${btn.dataset.id}/send`);
            loadQuotes();
          } catch (err) {
            alert(err.message);
            btn.disabled = false;
          }
        }),
      );
      tbody.querySelectorAll('.accept-btn').forEach((btn) =>
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try {
            await window.VTrackAPI.post(`/quotes/${btn.dataset.id}/accept`);
            loadQuotes();
          } catch (err) {
            alert(err.message);
            btn.disabled = false;
          }
        }),
      );
      tbody.querySelectorAll('.reject-btn').forEach((btn) =>
        btn.addEventListener('click', async () => {
          const reason = prompt('Rejection reason (optional):') || undefined;
          btn.disabled = true;
          try {
            await window.VTrackAPI.post(`/quotes/${btn.dataset.id}/reject`, { reason });
            loadQuotes();
          } catch (err) {
            alert(err.message);
            btn.disabled = false;
          }
        }),
      );
    }

    document.getElementById('add-line-btn').addEventListener('click', addLineRow);

    document.getElementById('create-quote-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('create-quote-error');
      errorBox.classList.add('d-none');

      const lines = [...document.querySelectorAll('.quote-line-row')].map((row) => ({
        productId: row.querySelector('.line-product').value,
        quantity: Number(row.querySelector('.line-qty').value),
        billingCycle: row.querySelector('.line-cycle').value,
        includeInstallation: row.querySelector('.line-install').checked,
      }));

      if (!lines.length) {
        errorBox.textContent = 'Add at least one product line.';
        errorBox.classList.remove('d-none');
        return;
      }

      const submitBtn = document.getElementById('create-quote-submit');
      submitBtn.disabled = true;
      try {
        await window.VTrackAPI.post('/quotes', {
          leadId: document.getElementById('q-lead-id').value || undefined,
          currency: document.getElementById('q-currency').value,
          country: document.getElementById('q-country').value || undefined,
          lines,
        });
        bootstrap.Modal.getInstance(document.getElementById('createQuoteModal')).hide();
        document.getElementById('quote-lines').innerHTML = '';
        loadQuotes();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
      }
    });

    (async () => {
      await loadReferenceData();
      addLineRow();
      loadQuotes();
    })();
    setInterval(loadQuotes, 20000);
  </script>
</body>
</html>
