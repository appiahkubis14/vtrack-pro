apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vtrack-ingress
  namespace: vtrack
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # WebSocket support
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.vtrack.example.com
      secretName: vtrack-tls
  rules:
    - host: api.vtrack.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vtrack-app
                port:
                  number: 80
