apiVersion: v1
kind: ConfigMap
metadata:
  name: vtrack-config
  namespace: vtrack
data:
  NODE_ENV: "production"
  PORT: "3000"
  API_PREFIX: "api"
  DB_HOST: "vtrack-postgres"
  DB_PORT: "5432"
  DB_DATABASE: "vtrack"
  TS_HOST: "vtrack-timescale"
  TS_PORT: "5432"
  TS_DATABASE: "vtrack_ts"
  REDIS_HOST: "vtrack-redis"
  REDIS_PORT: "6379"
  MQTT_BROKER_URL: "mqtt://vtrack-mqtt:1883"
