apiVersion: v1
kind: Service
metadata:
  name: vtrack-app
  namespace: vtrack
spec:
  selector:
    app: vtrack-app
  ports:
    - name: http
      port: 80
      targetPort: 3000
    - name: gt06
      port: 5023
      targetPort: 5023
      protocol: TCP
    - name: tk103
      port: 5040
      targetPort: 5040
      protocol: TCP
    - name: teltonika
      port: 5050
      targetPort: 5050
      protocol: TCP
  type: ClusterIP
---
# GPS device ports need a stable, internet-reachable endpoint for trackers to
# dial into - LoadBalancer (or a dedicated NLB via annotations on your cloud)
# rather than the ClusterIP above, which is for the REST/WebSocket API only.
apiVersion: v1
kind: Service
metadata:
  name: vtrack-device-ports
  namespace: vtrack
spec:
  selector:
    app: vtrack-app
  ports:
    - name: gt06
      port: 5023
      targetPort: 5023
    - name: tk103
      port: 5040
      targetPort: 5040
    - name: teltonika
      port: 5050
      targetPort: 5050
  type: LoadBalancer
